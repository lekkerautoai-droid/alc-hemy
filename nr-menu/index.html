<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f0c" />
<title>NR Botanicals — Menu</title>
<meta name="description" content="NR Botanicals — Pure · Natural · Botanics. Menu." />
<meta property="og:title" content="NR Botanicals — Menu" />
<meta property="og:description" content="Pure · Natural · Botanics" />
<meta property="og:image" content="assets/logo.jpeg" />
<link rel="icon" type="image/jpeg" href="assets/logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0f0c; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #e8e2d0; }
  * { box-sizing: border-box; }
  #root { width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="direction-1-apothecary.jsx"></script>

<script>
  // Babel transforms text/babel scripts asynchronously after load, so poll
  // until direction-1-apothecary.jsx has registered window.D1Menu, then mount.
  (function mount() {
    if (!window.D1Menu) { return requestAnimationFrame(mount); }
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(window.D1Menu));
  })();
</script>
</body>
</html>
