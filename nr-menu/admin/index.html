<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f0c" />
<meta name="robots" content="noindex, nofollow" />
<title>NR Botanicals — Admin</title>
<link rel="icon" type="image/jpeg" href="../assets/logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0d0f0c; --ink2: #151813; --ink3: #1d2118;
    --cream: #e8e2d0; --cream2: #b8b0a0; --cream3: #6d685c;
    --gold: #c9a866; --gold2: #8a7448;
    --danger: #b9624a; --ok: #6e9966;
    --rule: rgba(232,226,208,0.14); --rule2: rgba(232,226,208,0.28);
    --serif: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    --sans: "Inter Tight", -apple-system, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--ink); }
  body {
    font-family: var(--sans);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  * { box-sizing: border-box; }
  input, textarea, select, button { font: inherit; color: inherit; }
  input, textarea, select {
    background: var(--ink2);
    border: 1px solid var(--rule);
    color: var(--cream);
    padding: 11px 13px;
    border-radius: 4px;
    width: 100%;
    font-size: 16px; /* prevent iOS zoom */
    outline: none;
    transition: border-color 120ms;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
  label { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream2); margin-bottom: 6px; font-weight: 500; }
  button { cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 4px; border: 1px solid var(--rule2); background: transparent; color: var(--cream); font-size: 13px; letter-spacing: 0.06em; min-height: 42px; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn-primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
  .btn-primary:hover { background: var(--cream); border-color: var(--cream); color: var(--ink); }
  .btn-primary[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { color: var(--danger); border-color: rgba(185,98,74,0.4); }
  .btn-danger:hover { background: var(--danger); color: var(--ink); border-color: var(--danger); }
  .btn-ghost { border-color: transparent; }
  .btn-ghost:hover { background: var(--ink2); border-color: var(--rule); color: var(--cream); }
  .btn-icon { width: 36px; padding: 0; min-height: 36px; }

  ::placeholder { color: var(--cream3); }
  ::selection { background: rgba(201,168,102,0.35); color: var(--cream); }

  /* Hide ugly default file input */
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="admin.jsx"></script>

<script>
  (function mount() {
    if (!window.NRAdmin) { return requestAnimationFrame(mount); }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(window.NRAdmin));
  })();
</script>
</body>
</html>
